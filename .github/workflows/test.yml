name: Test LaunchNotes MCP Server

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run daily at 9am UTC to catch API schema changes
    - cron: '0 9 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run schema validation tests
        env:
          LAUNCHNOTES_API_TOKEN: ${{ secrets.LAUNCHNOTES_API_TOKEN }}
        run: npm run test:schema

      - name: Run unit tests
        run: npm run test:unit

      - name: Run all tests together
        env:
          LAUNCHNOTES_API_TOKEN: ${{ secrets.LAUNCHNOTES_API_TOKEN }}
        run: npm test

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: test
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: Notify on schema changes
        run: |
          echo "⚠️ LaunchNotes API schema validation failed!"
          echo "This could indicate breaking changes in the LaunchNotes API."
          echo "Review the test logs and update the MCP server accordingly."
