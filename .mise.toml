# LaunchNotes MCP Server - Mise Configuration
# https://mise.jdx.dev/

# Environment variables are inherited from shell
# Set LAUNCHNOTES_API_TOKEN in your shell or .env file

[tools]
# Define tool versions for consistency
node = "20"
npm = "10"

# ============================================================================
# BUILD TASKS
# ============================================================================

[tasks.build]
description = "Build the TypeScript project"
run = "npm run build"
sources = ["src/**/*.ts", "package.json", "tsconfig.json"]
outputs = ["dist/**/*.js"]

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf dist"

[tasks.rebuild]
description = "Clean and rebuild the project"
depends = ["clean", "build"]

[tasks.watch]
description = "Watch for changes and rebuild automatically"
run = "npm run dev"

# ============================================================================
# TESTING TASKS
# ============================================================================

[tasks.test]
description = "Run all tests"
run = "npm test"
depends = ["build"]

[tasks."test:schema"]
description = "Run schema validation tests against live API"
run = "npm run test:schema"
depends = ["build"]

[tasks."test:unit"]
description = "Run unit tests only"
run = "npm run test:unit"
depends = ["build"]

[tasks."test:tracking"]
description = "Run tracking headers tests"
run = "npx tsx tests/tracking-headers.test.ts"
depends = ["build"]

[tasks."test:watch"]
description = "Run tests in watch mode"
run = "npm run test:watch"

[tasks."test:ci"]
description = "Run tests for CI/CD pipeline"
depends = ["lint", "build", "test"]

# ============================================================================
# DEVELOPMENT TASKS
# ============================================================================

[tasks.dev]
description = "Start development server with auto-rebuild"
run = "npm run dev"

[tasks.start]
description = "Start the MCP server"
run = "npm start"
depends = ["build"]

[tasks.debug]
description = "Start the MCP server with Node.js debugging"
run = "node --inspect dist/index.js"
depends = ["build"]

# ============================================================================
# LINTING & FORMATTING
# ============================================================================

[tasks.lint]
description = "Run TypeScript compiler checks (no emit)"
run = "tsc --noEmit"

[tasks.format]
description = "Format code with Prettier (if available)"
run = """
if command -v prettier &> /dev/null; then
    prettier --write "src/**/*.ts" "tests/**/*.ts"
else
    echo "Prettier not installed. Run: npm install -D prettier"
fi
"""

[tasks.check]
description = "Run all code quality checks"
depends = ["lint", "test:schema"]

# ============================================================================
# DEPLOYMENT TASKS
# ============================================================================

[tasks."deploy:dry-run"]
description = "Dry run of npm publish to see what would be published"
run = "npm publish --dry-run"
depends = ["check", "build"]

[tasks."deploy:npm"]
description = "Publish package to npm registry"
run = """
echo "🚀 Publishing to npm..."
echo "Current version: $(node -p "require('./package.json').version")"
read -p "Are you sure you want to publish? (y/N) " -n 1 -r
echo
if [[ $REPLY =~ ^[Yy]$ ]]; then
    npm publish
else
    echo "❌ Publish cancelled"
    exit 1
fi
"""
depends = ["check", "build"]

[tasks."deploy:local"]
description = "Install the MCP server locally for testing"
run = """
npm run build
npm link
echo "✅ MCP server linked locally. You can now use 'launchnotes-mcp' command"
"""

[tasks."version:patch"]
description = "Bump patch version (e.g., 0.3.0 -> 0.3.1)"
run = "npm version patch"

[tasks."version:minor"]
description = "Bump minor version (e.g., 0.3.0 -> 0.4.0)"
run = "npm version minor"

[tasks."version:major"]
description = "Bump major version (e.g., 0.3.0 -> 1.0.0)"
run = "npm version major"

# ============================================================================
# UTILITY TASKS
# ============================================================================

[tasks.setup]
description = "Initial project setup - install dependencies"
run = """
echo "📦 Installing dependencies..."
npm install
echo "🔨 Building project..."
npm run build
echo "✅ Setup complete!"
"""

[tasks.info]
description = "Display project information"
run = """
echo "📦 LaunchNotes MCP Server"
echo "Version: $(node -p "require('./package.json').version")"
echo "Node: $(node --version)"
echo "NPM: $(npm --version)"
echo ""
echo "Available tools (16 total):"
echo "  Projects: 6 tools"
echo "  Announcements: 7 tools"
echo "  Feedback: 2 tools"
echo "  Analytics: 1 tool"
"""

[tasks.validate]
description = "Validate API token and test connection"
run = """
if [ -z "$LAUNCHNOTES_API_TOKEN" ]; then
    echo "❌ LAUNCHNOTES_API_TOKEN is not set"
    echo "Run: export LAUNCHNOTES_API_TOKEN='your-token-here'"
    exit 1
fi

echo "🔍 Testing API connection..."
node -e "
const axios = require('axios');
axios.post('https://app.launchnotes.io/graphql',
  { query: '{ viewer { projects { nodes { id } } } }' },
  { headers: {
      'Authorization': 'Bearer $LAUNCHNOTES_API_TOKEN',
      'Content-Type': 'application/json'
    }
  }
).then(() => {
  console.log('✅ API token is valid and connection successful');
}).catch(err => {
  if (err.response?.status === 401) {
    console.log('❌ Invalid API token');
  } else {
    console.log('❌ Connection failed:', err.message);
  }
  process.exit(1);
});
"
"""
depends = ["build"]

[tasks.tools]
description = "List all available MCP tools"
run = """
echo "🔧 Available LaunchNotes MCP Tools:"
echo ""
echo "📁 PROJECT TOOLS (6):"
echo "  • launchnotes_get_project - Get project details"
echo "  • launchnotes_list_projects - List all projects"
echo "  • launchnotes_update_project_custom_code - Update custom HTML/CSS"
echo "  • launchnotes_update_project_colors - Update color palette"
echo "  • launchnotes_update_project_content - Update content settings"
echo "  • launchnotes_update_project_features - Toggle features"
echo ""
echo "📢 ANNOUNCEMENT TOOLS (7):"
echo "  • launchnotes_list_announcements - List announcements"
echo "  • launchnotes_get_announcement - Get announcement details"
echo "  • launchnotes_create_announcement - Create new announcement"
echo "  • launchnotes_update_announcement - Update announcement"
echo "  • launchnotes_publish_announcement - Publish announcement"
echo "  • launchnotes_schedule_announcement - Schedule announcement"
echo "  • launchnotes_archive_announcement - Archive announcement"
echo ""
echo "💬 FEEDBACK TOOLS (2):"
echo "  • launchnotes_search_feedback - Search customer feedback"
echo "  • launchnotes_get_feedback - Get feedback details"
echo ""
echo "📊 ANALYTICS TOOLS (1):"
echo "  • launchnotes_get_top_announcements - Get top performing announcements"
"""

[tasks.release]
description = "Create a new release (bump version, commit, tag, push)"
run = """
echo "🚀 Creating new release..."
echo "Current version: $(node -p "require('./package.json').version")"
echo ""
echo "Select version bump:"
echo "1) Patch (bug fixes)"
echo "2) Minor (new features)"
echo "3) Major (breaking changes)"
read -p "Enter choice (1-3): " choice

case $choice in
    1) npm version patch ;;
    2) npm version minor ;;
    3) npm version major ;;
    *) echo "Invalid choice"; exit 1 ;;
esac

NEW_VERSION=$(node -p "require('./package.json').version")
echo ""
echo "📝 New version: $NEW_VERSION"
echo "Pushing to git..."
git push && git push --tags
echo ""
echo "✅ Release $NEW_VERSION created!"
echo "Next steps:"
echo "  1. Create PR if on feature branch"
echo "  2. After merge, run: mise run deploy:npm"
"""
depends = ["check", "build"]

# ============================================================================
# DEVELOPMENT WORKFLOWS
# ============================================================================

[tasks."workflow:feature"]
description = "Complete workflow for developing a new feature"
run = """
echo "🔄 Feature Development Workflow"
echo "1. Installing dependencies..."
npm install
echo "2. Running tests..."
mise run test
echo "3. Building project..."
mise run build
echo "4. Running linter..."
mise run lint
echo "✅ Ready for development!"
"""

[tasks."workflow:pr"]
description = "Prepare for pull request"
run = """
echo "🔍 Pre-PR Checklist"
echo "Running all checks..."
mise run check
echo ""
echo "📊 Test Results:"
mise run test:schema
echo ""
echo "✅ Ready to create PR!"
echo "Don't forget to:"
echo "  - Update version if needed"
echo "  - Write clear commit messages"
echo "  - Update documentation"
"""

[tasks."workflow:publish"]
description = "Complete publishing workflow"
run = """
echo "📦 Publishing Workflow"
echo "1. Running all tests..."
mise run check
echo "2. Building for production..."
mise run build
echo "3. Dry run to verify package..."
npm publish --dry-run
echo ""
read -p "Ready to publish? (y/N) " -n 1 -r
echo
if [[ $REPLY =~ ^[Yy]$ ]]; then
    npm publish
    echo "✅ Published successfully!"
    echo "Create a GitHub release with: git tag v$(node -p "require('./package.json').version")"
else
    echo "❌ Publish cancelled"
fi
"""